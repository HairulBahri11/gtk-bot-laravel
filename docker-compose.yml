services:
  app:
    build: .
    image: gtkjombang-dashboard:latest
    container_name: gtkjombang-dashboard-app
    restart: always
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.http.routers.gtkjombang-dashboard.rule=Host(`dashboard.gtkjombang.com`)
      - traefik.http.routers.gtkjombang-dashboard.tls=true
      - traefik.http.routers.gtkjombang-dashboard.entrypoints=web,websecure
      - traefik.http.routers.gtkjombang-dashboard.tls.certresolver=mytlschallenge
      - traefik.http.services.gtkjombang-dashboard.loadbalancer.server.port=80
    networks:
      - web

  worker:
    build: .
    image: gtkjombang-dashboard:latest
    container_name: gtkjombang-dashboard-worker
    restart: always
    env_file:
      - .env
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - app

  scheduler:
    build: .
    image: gtkjombang-dashboard:latest
    container_name: gtkjombang-dashboard-scheduler
    restart: always
    env_file:
      - .env
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - app

networks:
  web:
    external: true
    name: n8n_web
